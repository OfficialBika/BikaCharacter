name: CI

on:
  push:
    branches:
      - main
      - "optimize/**"
  pull_request:
    branches:
      - main

jobs:
  syntax-and-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install production dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run unit and concurrency tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify critical imports
        run: |
          python -c "import telegram, pymongo, aiohttp, PIL, regex, uharfbuzz, fontTools; print('imports: OK')"

      - name: Import full application
        run: |
          python -c "import bot; print('bot import: OK')"

      - name: Verify PyMongo Async client lifecycle
        run: |
          python - <<'PY'
          import asyncio
          from pymongo import AsyncMongoClient

          async def main():
              client = AsyncMongoClient("mongodb://127.0.0.1:27017", serverSelectionTimeoutMS=100)
              await client.close()

          asyncio.run(main())
          print("AsyncMongoClient lifecycle: OK")
          PY

      - name: Ensure deprecated Motor is absent
        run: |
          if grep -R --exclude-dir=.git --include='*.py' -nE '(^|[^[:alnum:]_])motor([._]|[^[:alnum:]_]|$)|AsyncIOMotor' .; then
            echo "Deprecated Motor references found."
            exit 1
          fi
